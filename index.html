<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ═══════════════════════════════════════════════
         PRIMARY SEO — what crawlers see
         ═══════════════════════════════════════════════ -->
    <title>Adonay Mussie — Cybersecurity Professional</title>
    <meta
      name="description"
      content="Portfolio of Adonay Mussie, a cybersecurity professional specializing in Vulnerability Assessment, Penetration Testing, Application Security, and DevSecOps."
    />
    <meta name="author" content="Adonay Mussie" />
    <meta
      name="keywords"
      content="Adonay Mussie, cybersecurity, penetration testing, VAPT, DevSecOps, application security, Ethiopia"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="canonical" href="https://adonay-portfolio-v2.vercel.app" />

    <!-- ═══════════════════════════════════════════════
         Open Graph — LinkedIn, Facebook, WhatsApp, Telegram
         ═══════════════════════════════════════════════ -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://adonay-portfolio-v2.vercel.app"
    />
    <meta
      property="og:title"
      content="Adonay Mussie — Cybersecurity Professional"
    />
    <meta
      property="og:description"
      content="Vulnerability Assessment, Penetration Testing, Application Security, and DevSecOps. Currently ranked Top 1% on TryHackMe."
    />
    <meta
      property="og:image"
      content="https://adonay-portfolio-v2.vercel.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Adonay Mussie — Cybersecurity Professional portfolio preview" />

    <!-- ═══════════════════════════════════════════════
         Twitter Card
         ═══════════════════════════════════════════════ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Adonay Mussie — Cybersecurity Professional"
    />
    <meta
      name="twitter:description"
      content="Vulnerability Assessment, Penetration Testing, Application Security, and DevSecOps."
    />
    <meta
      name="twitter:image"
      content="https://adonay-portfolio-v2.vercel.app/og-image.png"
    />

    <!-- Dark mode flash prevention -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme')
          if (theme === 'dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {}
      })()
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
